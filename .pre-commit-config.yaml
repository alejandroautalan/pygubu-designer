repos:
  - repo: local
    hooks:
      - id: hatch-fix
        name: Formatear y limpiar código (Hatch)
        entry: hatch run fix
        language: system
        types: [python]
        pass_filenames: false

      - id: hatch-check
        name: Linter Flake8 + Pylint (Hatch)
        entry: hatch run check
        language: system
        types: [python]
        pass_filenames: false
